<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AegisQA — AI-Powered QA Management Platform</title>
    <meta name="description" content="Modern AI-Powered QA Management Platform focused on QA teams, testing progress, intelligent workload distribution, PRD & Figma context, daily reports, and QA leadership." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:9999;padding:20px;font-family:monospace">' + 
          '<h3>ERROR: ' + e.message + '</h3>' + 
          '<pre>' + e.error.stack + '</pre>' + 
          '</div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
